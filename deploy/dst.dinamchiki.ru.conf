# Админка сайта «Динамчики» на проде: dst.dinamchiki.ru.
# Статика — /var/www/dst.dinamchiki.ru/html (выкладывает CI), API — /api/graphql →
# dinamchiki-gql-admin на 127.0.0.1:8176 (/query). Перед всем — HTTP-авторизация (/etc/nginx/htpasswd/dst.dinamchiki.ru),
# дальше собственный вход админки по ADMIN_PASSWORD.

server {
    listen 80;
    listen [::]:80;
    server_name dst.dinamchiki.ru;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dst.dinamchiki.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dst.dinamchiki.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dst.dinamchiki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dst.dinamchiki.ru/privkey.pem;
    include snippets/ssl-params.conf;

    auth_basic "DFC Dinamchiki";
    auth_basic_user_file /etc/nginx/htpasswd/dst.dinamchiki.ru;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /api/graphql {
        proxy_pass http://127.0.0.1:8176/query;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Прежний путь (до 01.11.2026) — для открытых вкладок со старой сборкой. Убрать ~15.11.
    location /query {
        proxy_pass http://127.0.0.1:8176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        root /var/www/dst.dinamchiki.ru/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        root /var/www/dst.dinamchiki.ru/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
